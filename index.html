========================= */

body{

/* =========================
   BRAND HEADER
========================= */

.brand-header{

  text-align:center;

  padding:18px 10px;

  font-size:22px;

  font-weight:900;

  letter-spacing:3px;

  color:#00ffcc;

  text-transform:uppercase;

  position:fixed;

  top:0;
  left:0;

  z-index:20;

@keyframes glowMove{

  }

  100%{

  }

========================= */

.nav{

}


.nav a{

}


/* =========================

========================= */

.container{

  margin:auto;

  padding-left:10px;

/* =========================

========================= */

.video-box video{

  width:100%;

  border:2px solid #00ffcc;

}


/* =========================
   TIMER
========================= */

.timer{

}


/* =========================
   CONNECT
========================= */

button.connect{

  width:100%;

  padding:15px;

  margin-top:15px;

  border:none;

  border-radius:10px;

  font-size:16px;

  font-weight:bold;

  background:#00ffcc;

  color:#000;

  cursor:not-allowed;

  opacity:.5;

  transition:.3s;

}


button.connect.enabled{

  cursor:pointer;

  opacity:1;

}


button.connect.enabled:hover{

  transform:scale(1.03);

/* =========================

========================= */

.voucher-section{

}


.card{

.price{

}

.buy{

/* =================================================
   LOGIN POPUP
================================================= */

.login-modal{

  display:none;

  position:fixed;

  inset:0;

  z-index:9999;

  background:
    rgba(0,0,0,.92);

  backdrop-filter:blur(8px);

  justify-content:center;

  align-items:center;

  padding:15px;

}


.login-modal.show{

  display:flex;

}


/* =========================
   LOGIN BOX
========================= */

.login-box{

  position:relative;

  width:100%;

  max-width:390px;

  max-height:90vh;

  overflow:auto;

  background:
    rgba(0,0,0,.92);

  border:
    1px solid rgba(0,255,100,.4);

  border-radius:18px;

  padding:20px;

  text-align:center;

  box-shadow:
    0 0 25px rgba(0,255,100,.25);

  animation:popup .3s ease;

}


@keyframes popup{

  from{

    transform:scale(.7);

    opacity:0;

  }

  to{

    transform:scale(1);

    opacity:1;

  }

}


/* =========================
   CLOSE
========================= */

.close-login{

  position:absolute;

  right:10px;

  top:8px;

  width:35px;

  height:35px;

  border:none;

  border-radius:50%;

  background:#00ff66;

  color:#000;

  font-size:25px;

  font-weight:bold;

  cursor:pointer;

  z-index:20;

}


/* =========================
   MATRIX
========================= */

#matrix{

  position:absolute;

  inset:0;

  width:100%;

  height:100%;

  border-radius:18px;

  z-index:0;

  opacity:.25;

}


.login-content{

  position:relative;

  z-index:2;

}


/* =========================
   LOGIN TITLE
========================= */

.login-title{

  font-size:24px;

  letter-spacing:6px;

  color:#00ff66;

  text-shadow:
    0 0 10px #00ff66,
    0 0 20px #00ff66;

  margin-bottom:15px;

}


#clock{

  font-size:13px;

  color:#00ff66;

  margin-bottom:10px;

}


.status{

  font-size:13px;

  color:#00ff88;

  margin-bottom:10px;

}


.online-dot{

  display:inline-block;

  width:8px;

  height:8px;

  background:#00ff66;

  border-radius:50%;

  margin-right:5px;

  box-shadow:0 0 10px #00ff66;

}


/* =========================
   INPUT
========================= */

.login-box input[type="text"],
.login-box input[type="password"]{

  width:100%;

  padding:12px;

  margin:6px 0;

  border-radius:10px;

  border:none;

  background:
    rgba(0,255,100,.08);

  color:#fff;

  outline:none;

}


.login-box input:focus{

  box-shadow:
    0 0 10px #00ff66;

}


.login-box input::placeholder{

  color:#aaa;

}


/* =========================
   LOGIN BUTTON
========================= */

.login-submit{

  width:100%;

  padding:13px;

  margin-top:8px;

  border:none;

  border-radius:10px;

  background:
    linear-gradient(
      45deg,
      #00ff66,
      #00cc44
    );

  color:#000;

  font-size:15px;

  font-weight:bold;

  cursor:pointer;

}


/* =========================
   BUY VOUCHER

   FOOTER
========================= */

.login-footer{

  margin-top:14px;

}


/* =========================
   MOBILE
========================= */

@media(max-width:500px){

  .brand-header{

    font-size:16px;

  }


  .login-box{

  }


  .login-title{

    font-size:21px;

  }

}

</style>

</head>


<body>

<!-- =========================

<div class="container">


  <!-- VIDEO -->

  <div class="video-box">

    <video
      id="adsVideo"
      autoplay
      muted
      playsinline>

      <source
        src="ads.mp4"
        type="video/mp4">

    </video>

  </div>


  <!-- TIMER -->

  <div class="timer">

    Please wait:

  <button
    id="connectBtn"
    class="connect"
    disabled
    onclick="openLogin()">

  </button>


  <!-- =========================

  <div class="voucher-section">

    <div class="voucher-title">

<div
  id="loginModal"
  class="login-modal">

      type="button"
      class="close-login"
      onclick="closeLogin()">

      ×

    </button>

<script>


/* =========================
   COUNTDOWN
========================= */

let timeLeft = 10;


const count =
  document.getElementById("count");


const btn =
  document.getElementById("connectBtn");


const video =
  document.getElementById("adsVideo");


function unlock(){

  btn.disabled = false;

  btn.classList.add("enabled");

  count.innerText = "0";

}


/* =========================
   TIMER
========================= */

const interval = setInterval(()=>{

  timeLeft--;

  count.innerText =
    timeLeft;


  if(timeLeft <= 0){

    clearInterval(interval);

    unlock();

  }

},1000);


/* =========================
   VIDEO END
========================= */

video.addEventListener(
  "ended",
  ()=>{

    clearInterval(interval);

    unlock();

  }
);


/* =========================
   OPEN LOGIN
========================= */

function openLogin(){

  if(btn.disabled){

    return;

  }

  document
    .getElementById("loginModal")
    .classList.add("show");

}


/* =========================
   CLOSE LOGIN
========================= */

function closeLogin(){

  document
    .getElementById("loginModal")
    .classList.remove("show");

}


/* =========================
   CLICK OUTSIDE
========================= */

document
  .getElementById("loginModal")
  .addEventListener(
    "click",
    function(e){

      if(e.target === this){

        closeLogin();

      }

    }
  );


/* =========================
   ESC
========================= */

document.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Escape"){

      closeLogin();

    }

  }
);


/* =========================
   CLOCK
========================= */

function updateClock(){

  document.getElementById("clock").innerHTML =
    "🕒 " +
    new Date().toLocaleTimeString();

}


updateClock();


setInterval(
  updateClock,
  1000
);


/* =========================
   BUY VOUCHER
========================= */

function buyVoucher(){

  window.location.href =
    "http://120.10.10.1/voucher.html";

}


/* =========================
   MATRIX
========================= */

const canvas =
  document.getElementById("matrix");

const ctx =
  canvas.getContext("2d");


function resizeMatrix(){

  canvas.width =
    canvas.offsetWidth;

  canvas.height =
    canvas.offsetHeight;

  columns =
    Math.floor(
      canvas.width / fontSize
    );

  drops =
    Array(columns).fill(1);

}


const letters =
  "01KLICKZONENETWORKCYBERMATRIX";

const arr =
  letters.split("");

const fontSize = 14;

let columns =
  Math.floor(
    canvas.offsetWidth / fontSize
  );

let drops =
  Array(columns).fill(1);


resizeMatrix();


window.addEventListener(
  "resize",
  resizeMatrix
);


function drawMatrix(){

  ctx.fillStyle =
    "rgba(0,0,0,.08)";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.fillStyle =
    "#00ff66";

  ctx.font =
    fontSize + "px monospace";


  for(
    let i=0;
    i<drops.length;
    i++
  ){

    const text =
      arr[
        Math.floor(
          Math.random()*arr.length
        )
      ];


    ctx.fillText(
      text,
      i*fontSize,
      drops[i]*fontSize
    );


    if(
      drops[i]*fontSize >
      canvas.height &&
      Math.random() > .975
    ){

      drops[i]=0;

    }


    drops[i]++;

  }

}


setInterval(
  drawMatrix,
  35
);


</script>


</body>

</html>
