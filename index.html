```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no">

<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">

<title>Klickzone Hotspot</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#000;
  color:#fff;
}

/* =========================
   BRAND HEADER
========================= */

.brand-header{
  text-align:center;
  padding:18px 10px;
  font-size:22px;
  font-weight:900;
  letter-spacing:3px;
  color:#00ffcc;
  text-transform:uppercase;

  position:fixed;
  top:0;
  left:0;
  width:100%;

  z-index:20;

  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(12px);

  border-bottom:1px solid rgba(0,255,204,0.3);

  text-shadow:
    0 0 5px #00ffcc,
    0 0 10px #00ffcc,
    0 0 20px #00ffcc;

  animation:glowMove 3s infinite alternate;
}

@keyframes glowMove{

  0%{
    text-shadow:
      0 0 5px #00ffcc,
      0 0 10px #00ffcc;

    letter-spacing:3px;
  }

  100%{
    text-shadow:
      0 0 15px #00ffcc,
      0 0 30px #00ffcc;

    letter-spacing:5px;
  }

}

/* =========================
   TOP MENU
========================= */

.nav{
  position:fixed;
  top:60px;
  left:0;
  width:100%;

  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(10px);

  display:flex;
  justify-content:space-around;

  padding:12px 5px;

  z-index:10;

  border-bottom:1px solid rgba(0,255,204,0.3);
}

.nav a{
  color:#00ffcc;
  text-decoration:none;

  font-size:12px;
  font-weight:bold;
}

/* =========================
   MAIN CONTAINER
========================= */

.container{
  padding-top:140px;

  max-width:500px;

  margin:auto;

  text-align:center;

  padding-left:10px;
  padding-right:10px;
}

/* =========================
   VIDEO
========================= */

.video-box video{
  width:100%;
  height:260px;

  object-fit:cover;

  border-radius:12px;

  border:2px solid #00ffcc;

  background:#111;
}

/* =========================
   TIMER
========================= */

.timer{
  margin-top:10px;

  font-size:16px;

  color:#00ffcc;

  font-weight:bold;
}

/* =========================
   CONNECT BUTTON
========================= */

button.connect{

  width:100%;

  padding:15px;

  margin-top:15px;

  border:none;

  border-radius:10px;

  font-size:16px;

  font-weight:bold;

  background:#00ffcc;

  color:#000;

  cursor:not-allowed;

  opacity:0.5;

  transition:0.3s;
}

button.connect.enabled{

  cursor:pointer;

  opacity:1;

}

button.connect.enabled:hover{

  transform:scale(1.03);

  box-shadow:
    0 0 10px #00ffcc,
    0 0 25px rgba(0,255,204,0.5);
}

/* =========================
   VOUCHER SECTION
========================= */

.voucher-section{

  margin-top:30px;

  padding:10px;
}

.voucher-title{

  color:#00ffcc;

  font-size:18px;

  margin-bottom:10px;
}

.grid{

  display:grid;

  grid-template-columns:
    repeat(auto-fit,minmax(200px,1fr));

  gap:10px;
}

.card{

  background:
    rgba(0,255,204,0.08);

  border:1px solid #00ffcc;

  border-radius:12px;

  padding:15px;

  box-shadow:
    0 0 8px rgba(0,255,204,0.15);
}

.price{

  font-size:28px;

  color:#00ffcc;

  font-weight:bold;
}

.desc{

  font-size:13px;

  margin:8px 0;

  opacity:0.8;
}

.buy{

  width:100%;

  padding:10px;

  border:none;

  border-radius:8px;

  background:#00ffcc;

  color:#000;

  font-weight:bold;

  cursor:pointer;

  transition:0.2s;
}

.buy:hover{

  opacity:0.8;

  transform:scale(1.02);
}

/* =========================
   LOGIN MODAL
========================= */

.modal{

  display:none;

  position:fixed;

  z-index:9999;

  left:0;
  top:0;

  width:100%;
  height:100%;

  background:
    rgba(0,0,0,0.88);

  backdrop-filter:blur(8px);

  justify-content:center;

  align-items:center;

  padding:15px;
}

.modal.show{

  display:flex;
}

/* =========================
   LOGIN BOX
========================= */

.modal-box{

  position:relative;

  width:100%;

  max-width:400px;

  background:#050505;

  border:2px solid #00ffcc;

  border-radius:18px;

  padding:20px 15px;

  box-shadow:

    0 0 15px #00ffcc,

    0 0 40px
    rgba(0,255,204,0.4);

  animation:
    popup 0.3s ease;
}

@keyframes popup{

  from{

    transform:scale(0.7);

    opacity:0;
  }

  to{

    transform:scale(1);

    opacity:1;
  }

}

/* =========================
   CLOSE BUTTON
========================= */

.close-btn{

  position:absolute;

  right:10px;

  top:8px;

  width:35px;

  height:35px;

  border:none;

  border-radius:50%;

  background:#00ffcc;

  color:#000;

  font-size:25px;

  font-weight:bold;

  cursor:pointer;

  z-index:20;

  line-height:35px;
}

.close-btn:hover{

  transform:rotate(90deg);

}

/* =========================
   LOGIN TITLE
========================= */

.login-title{

  text-align:center;

  color:#00ffcc;

  font-size:20px;

  font-weight:bold;

  margin-bottom:5px;

  letter-spacing:1px;
}

.login-subtitle{

  text-align:center;

  color:#fff;

  font-size:12px;

  margin-bottom:12px;

  opacity:0.8;
}

/* =========================
   LOGIN IFRAME
========================= */

.login-frame{

  width:100%;

  height:330px;

  border:none;

  border-radius:10px;

  background:#fff;

  display:block;
}

/* =========================
   MOBILE
========================= */

@media(max-width:500px){

  .brand-header{

    font-size:16px;

    letter-spacing:2px;

    padding:17px 5px;
  }

  .nav{

    top:53px;

    padding:10px 3px;
  }

  .nav a{

    font-size:10px;
  }

  .container{

    padding-top:125px;
  }

  .video-box video{

    height:220px;
  }

  .modal{

    padding:10px;
  }

  .modal-box{

    max-width:360px;

    padding:18px 10px;
  }

  .login-frame{

    height:320px;
  }

}

</style>

</head>

<body>


<!-- =========================
     BRAND HEADER
========================= -->

<div class="brand-header">

  KLICKZONE HOTSPOT & DIGITAL PRINT

</div>


<!-- =========================
     TOP MENU
========================= -->

<div class="nav">

  <a href="#">Printing</a>

  <a href="#">Xerox</a>

  <a href="#">Scanning</a>

  <a href="#">Repair</a>

  <a href="#">WiFi</a>

</div>


<!-- =========================
     MAIN
========================= -->

<div class="container">


  <!-- VIDEO AD -->

  <div class="video-box">

    <video
      id="adsVideo"
      autoplay
      muted
      playsinline>

      <source
        src="ads.mp4"
        type="video/mp4">

      Your browser does not support
      the video tag.

    </video>

  </div>


  <!-- TIMER -->

  <div class="timer">

    Please wait:
    <span id="count">10</span>s

  </div>


  <!-- CONNECT -->

  <button
    id="connectBtn"
    class="connect"
    disabled
    onclick="openLogin()">

    CONNECT NOW

  </button>


  <!-- =========================
       VOUCHERS
  ========================= -->

  <div class="voucher-section">

    <div class="voucher-title">

      💳 WIFI VOUCHER PRICES

    </div>


    <div class="grid">


      <!-- ₱10 -->

      <div class="card">

        <div class="price">
          ₱10
        </div>

        <div class="desc">
          8 HOURS ACCESS
        </div>

        <button
          class="buy"
          onclick="location.href='payment.html'">

          BUY NOW

        </button>

      </div>


      <!-- ₱20 -->

      <div class="card">

        <div class="price">
          ₱20
        </div>

        <div class="desc">
          1 DAY ACCESS
        </div>

        <button
          class="buy"
          onclick="location.href='payment.html'">

          BUY NOW

        </button>

      </div>


      <!-- ₱50 -->

      <div class="card">

        <div class="price">
          ₱50
        </div>

        <div class="desc">
          3 DAYS ACCESS
        </div>

        <button
          class="buy"
          onclick="location.href='payment.html'">

          BUY NOW

        </button>

      </div>


      <!-- ₱100 -->

      <div class="card">

        <div class="price">
          ₱100
        </div>

        <div class="desc">
          1 MONTH ACCESS
        </div>

        <button
          class="buy"
          onclick="location.href='payment.html'">

          BUY NOW

        </button>

      </div>


    </div>

  </div>


</div>


<!-- =========================
     LOGIN POPUP
========================= -->

<div
  id="loginModal"
  class="modal">


  <div class="modal-box">


    <!-- CLOSE -->

    <button
      class="close-btn"
      onclick="closeLogin()">

      ×

    </button>


    <!-- TITLE -->

    <div class="login-title">

      KLICKZONE HOTSPOT

    </div>


    <div class="login-subtitle">

      ENTER YOUR WIFI VOUCHER

    </div>


    <!-- MIKROTIK LOGIN -->

    <iframe
      src="http://120.10.10.1/login2.html"
      class="login-frame"
      frameborder="0">

    </iframe>


  </div>

</div>


<script>


/* =========================
   COUNTDOWN
========================= */

let timeLeft = 10;


const count =
  document.getElementById("count");


const btn =
  document.getElementById("connectBtn");


const video =
  document.getElementById("adsVideo");


/* =========================
   UNLOCK
========================= */

function unlock(){

  btn.disabled = false;

  btn.classList.add("enabled");

  count.innerText = "0";

}


/* =========================
   COUNTDOWN TIMER
========================= */

const interval =
  setInterval(() => {

    timeLeft--;

    count.innerText =
      timeLeft;


    if(timeLeft <= 0){

      clearInterval(interval);

      unlock();

    }

  },1000);


/* =========================
   VIDEO FINISHED
========================= */

video.addEventListener(
  "ended",
  () => {

    clearInterval(interval);

    unlock();

  }
);


/* =========================
   OPEN LOGIN
========================= */

function openLogin(){

  if(btn.disabled){

    return;

  }

  document
    .getElementById("loginModal")
    .classList.add("show");

}


/* =========================
   CLOSE LOGIN
========================= */

function closeLogin(){

  document
    .getElementById("loginModal")
    .classList.remove("show");

}


/* =========================
   CLICK OUTSIDE
========================= */

document
  .getElementById("loginModal")
  .addEventListener(
    "click",
    function(event){

      if(event.target === this){

        closeLogin();

      }

    }
  );


/* =========================
   ESC KEY
========================= */

document.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Escape"){

      closeLogin();

    }

  }
);

</script>


</body>
</html>
