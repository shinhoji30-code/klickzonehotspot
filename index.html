.login-box{

@keyframes popup{

/* =====================================================
   MOBILE
===================================================== */

</style>

<script>

/* =====================================================
   COUNTDOWN
===================================================== */

let timeLeft = 10;

const count =
  document.getElementById("count");

const connectBtn =
  document.getElementById("connectBtn");

const video =
  document.getElementById("adsVideo");


function unlock(){

  connectBtn.disabled = false;

  connectBtn.classList.add("enabled");

  count.innerText = "0";

}


/* =====================================================
   COUNTDOWN
===================================================== */

const timer =
setInterval(function(){

  timeLeft--;

  count.innerText =
    timeLeft;


  if(timeLeft <= 0){

    clearInterval(timer);

    unlock();

  }

},1000);


/* =====================================================
   VIDEO FINISHED
===================================================== */

video.addEventListener(
  "ended",
  function(){

    clearInterval(timer);

    unlock();

  }
);


/* =====================================================
   OPEN LOGIN
===================================================== */

function openLogin(){

  if(connectBtn.disabled){

    return;

  }


  document
    .getElementById("loginModal")
    .classList.add("show");


  startMatrix();

}


/* =====================================================
   CLOSE LOGIN
===================================================== */

function closeLogin(){

  document
    .getElementById("loginModal")
    .classList.remove("show");

}


/* =====================================================
   CLICK OUTSIDE
===================================================== */

document
  .getElementById("loginModal")
  .addEventListener(
    "click",
    function(e){

      if(e.target === this){

        closeLogin();

      }

    }
  );


/* =====================================================
   ESC
===================================================== */

document.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Escape"){

      closeLogin();

    }

  }
);


/* =====================================================
   CLOCK
===================================================== */

function updateClock(){

  document.getElementById("clock").innerHTML =
    "🕒 " +
    new Date().toLocaleTimeString();

}


updateClock();


setInterval(
  updateClock,
  1000
);


/* =====================================================
   BUY VOUCHER
===================================================== */

function buyVoucher(){

  window.location.href =
    "http://120.10.10.1/voucher.html";

}


/* =====================================================
   MATRIX
===================================================== */

const canvas =
  document.getElementById("matrix");

const ctx =
  canvas.getContext("2d");


const letters =
  "01KLICKZONENETWORKCYBERMATRIX";

const arr =
  letters.split("");


const fontSize = 14;

let matrixStarted = false;


function resizeMatrix(){

  canvas.width =
    canvas.offsetWidth;

  canvas.height =
    canvas.offsetHeight;

}


function startMatrix(){

  if(matrixStarted){

    return;

  }

  matrixStarted = true;

  resizeMatrix();

  let columns =
    Math.floor(
      canvas.width / fontSize
    );


  let drops =
    Array(columns).fill(1);


  function draw(){

    ctx.fillStyle =
      "rgba(0,0,0,.08)";

    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    ctx.fillStyle =
      "#00ff66";

    ctx.font =
      fontSize + "px monospace";


    for(
      let i=0;
      i<drops.length;
      i++
    ){

      const text =
        arr[
          Math.floor(
            Math.random()*arr.length
          )
        ];


      ctx.fillText(
        text,
        i*fontSize,
        drops[i]*fontSize
      );


      if(
        drops[i]*fontSize >
        canvas.height &&
        Math.random() > .975
      ){

        drops[i] = 0;

      }


      drops[i]++;

    }

  }


  setInterval(
    draw,
    35
  );

}


window.addEventListener(
  "resize",
  resizeMatrix
);

</script>

</body>
