<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WiFi Access</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#000;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

/* CONTAINER */
.container{
  width:95%;
  max-width:500px;
  text-align:center;
}

/* ADS SCREEN */
.video-box video{
  width:100%;
  height:280px;
  object-fit:cover;
  border-radius:12px;
  border:2px solid #00ffcc;
  box-shadow:0 0 20px rgba(0,255,204,0.3);
}

/* TIMER */
.timer{
  margin-top:12px;
  font-size:18px;
  color:#00ffcc;
  font-weight:bold;
}

/* CONNECT BUTTON */
button{
  width:100%;
  padding:15px;
  margin-top:15px;
  border:none;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
  background:#00ffcc;
  color:#000;
  cursor:not-allowed;
  opacity:0.5;
}

button.enabled{
  cursor:pointer;
  opacity:1;
}

</style>
</head>

<body>

<div class="container">

  <!-- ADS VIDEO (BIG SCREEN) -->
  <div class="video-box">
    <video id="adsVideo" autoplay muted playsinline>
      <source src="ads.mp4" type="video/mp4">
    </video>
  </div>

  <!-- TIMER -->
  <div class="timer">
    Please wait: <span id="count">30</span>s
  </div>

  <!-- CONNECT -->
  <button id="connectBtn" disabled onclick="location.href='http://120.10.10.1/login2.html'">
    CONNECT NOW
  </button>

</div>

<script>

let timeLeft = 30;

const count = document.getElementById("count");
const btn = document.getElementById("connectBtn");
const video = document.getElementById("adsVideo");

function unlock(){
  btn.disabled = false;
  btn.classList.add("enabled");
  btn.innerText = "CONNECT NOW";
}

/* TIMER */
const interval = setInterval(()=>{
  timeLeft--;
  count.innerText = timeLeft;

  if(timeLeft <= 0){
    clearInterval(interval);
    unlock();
  }
},1000);

/* VIDEO END UNLOCK */
video.addEventListener("ended", ()=>{
  clearInterval(interval);
  unlock();
});

</script>

</body>
</html>
