<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Renson Farm Inventory</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  font-family:
    Arial,
    sans-serif;

  background:
    #071f14;

  color: white;

}

.container {

  max-width: 650px;

  margin: auto;

  padding: 18px;

}

h1 {

  text-align: center;

  margin-bottom: 5px;

  color: #9cffbd;

}

.subtitle {

  text-align: center;

  color: #9bb7a6;

  margin-bottom: 20px;

}

.card {

  background: #0d3020;

  border-radius: 15px;

  padding: 18px;

  margin-bottom: 15px;

  box-shadow:
    0 5px 20px
    rgba(0,0,0,.25);

}

label {

  display: block;

  margin-bottom: 7px;

  font-weight: bold;

}

input {

  width: 100%;

  padding: 13px;

  border-radius: 9px;

  border: 1px solid #315b45;

  background: #092519;

  color: white;

  font-size: 16px;

}

input:focus {

  outline: none;

  border-color: #55d987;

}

.receipt-preview {

  margin-top: 10px;

  text-align: center;

}

.receipt-preview img {

  max-width: 100%;

  max-height: 250px;

  border-radius: 10px;

}

.item {

  border: 1px solid #315b45;

  border-radius: 10px;

  padding: 12px;

  margin-bottom: 10px;

}

.item-row {

  display: flex;

  gap: 8px;

}

.item-row input:first-child {

  flex: 1;

}

.amount {

  width: 130px;

}

button {

  width: 100%;

  border: 0;

  border-radius: 10px;

  padding: 13px;

  font-size: 16px;

  font-weight: bold;

  cursor: pointer;

  margin-top: 10px;

}

.add-btn {

  background: #1e7546;

  color: white;

}

.save-btn {

  background: #4bd47d;

  color: #062513;

}

.clear-btn {

  background: #315443;

  color: white;

}

.delete-btn {

  background: #8c3030;

  color: white;

  margin-top: 8px;

}

.remove-btn {

  background: #7c2929;

  color: white;

  width: auto;

  padding: 10px 14px;

  margin-top: 8px;

}

.total-box {

  display: flex;

  justify-content: space-between;

  align-items: center;

  padding: 15px;

  background: #062719;

  border-radius: 10px;

  margin-top: 15px;

}

.total {

  font-size: 24px;

  font-weight: bold;

  color: #7dffa5;

}

.cloud-total {

  text-align: center;

  padding: 18px;

  border-radius: 12px;

  background: #16452d;

  margin-bottom: 15px;

}

.cloud-total small {

  color: #a8c7b4;

}

.cloud-total strong {

  display: block;

  font-size: 30px;

  color: #8dffb1;

  margin-top: 5px;

}

.entry {

  border-top: 1px solid #315b45;

  padding: 15px 0;

}

.entry:first-child {

  border-top: 0;

}

.entry-date {

  color: #9fbbaa;

  font-size: 13px;

}

.entry-purchased {

  color: #8dffb1;

  font-size: 14px;

  margin-top: 5px;

}

.entry-receipt {

  color: #bde8ca;

  margin-top: 5px;

}

.entry-item {

  display: flex;

  justify-content: space-between;

  gap: 10px;

  padding: 5px 0;

}

.entry-total {

  text-align: right;

  color: #8dffb1;

  font-size: 18px;

  font-weight: bold;

  margin-top: 5px;

}

.status {

  text-align: center;

  padding: 10px;

  color: #a8c7b4;

  font-size: 14px;

}

.empty {

  text-align: center;

  color: #8ba696;

  padding: 20px;

}

</style>

</head>


<body>

<div class="container">

<h1>🌴 Renson Farm</h1>

<div class="subtitle">
Inventory Management
</div>


<div class="cloud-total">

<small>Cloud Grand Total</small>

<strong id="cloudTotal">
₱0.00
</strong>

</div>


<!-- =====================================================
     RECEIPT
===================================================== -->

<div class="card">

<label>
Receipt Date / Date Purchased
</label>

<input
  type="date"
  id="receiptDate"
>


<label style="margin-top:15px;">
Receipt
</label>

<input
  type="file"
  id="receipt"
  accept="image/*"
  capture="environment"
>


<div
  id="receiptPreview"
  class="receipt-preview"
></div>

</div>


<!-- =====================================================
     INVENTORY ITEMS
===================================================== -->

<div class="card">

<label>
Inventory Items
</label>

<div id="items"></div>


<button
  type="button"
  class="add-btn"
  onclick="addItem()"
>
＋ Add Item
</button>


<div class="total-box">

<span>
Current Total
</span>

<span
  id="currentTotal"
  class="total"
>
₱0.00
</span>

</div>


<button
  type="button"
  class="save-btn"
  onclick="saveInventory()"
>
💾 Save Inventory
</button>


<button
  type="button"
  class="clear-btn"
  onclick="clearForm()"
>
Clear
</button>

</div>


<!-- =====================================================
     HISTORY
===================================================== -->

<div class="card">

<h3>
Recent Entries
</h3>

<div
  id="status"
  class="status"
>
Connecting to Google Sheets...
</div>

<div id="history"></div>


<button
  type="button"
  class="add-btn"
  onclick="loadInventory()"
>
🔄 Refresh from Google Sheets
</button>

</div>

</div>


<script>


/* =====================================================
   GOOGLE APPS SCRIPT URL
===================================================== */

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbzpqLYsCndrqHyZNU-UXyOzH181MmxWkaHyC3-ShNWlTeSgtFNVQL713UzjoRraeri0Bw/exec";


let items = [];


/* =====================================================
   ADD ITEM
===================================================== */

function addItem() {

  items.push({

    description: "",

    amount: ""

  });

  renderItems();

}


/* =====================================================
   REMOVE ITEM
===================================================== */

function removeItem(index) {

  items.splice(index, 1);

  if (items.length === 0) {

    addItem();

    return;

  }

  renderItems();

}


/* =====================================================
   UPDATE ITEM
===================================================== */

function updateItem(
  index,
  field,
  value
) {

  items[index][field] = value;

  calculateTotal();

}


/* =====================================================
   RENDER ITEMS
===================================================== */

function renderItems() {

  const container =
    document.getElementById(
      "items"
    );

  container.innerHTML = "";


  items.forEach(
    function(item, index) {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "item";


      div.innerHTML = `

        <div class="item-row">

          <input
            type="text"
            placeholder="Description"
            value="${escapeHtml(item.description)}"
            oninput="
              updateItem(
                ${index},
                'description',
                this.value
              )
            "
          >

          <input
            type="number"
            step="0.01"
            placeholder="Amount"
            class="amount"
            value="${item.amount}"
            oninput="
              updateItem(
                ${index},
                'amount',
                this.value
              )
            "
          >

        </div>


        <button
          type="button"
          class="remove-btn"
          onclick="removeItem(${index})"
        >
          Remove
        </button>

      `;


      container.appendChild(div);

    }
  );


  calculateTotal();

}


/* =====================================================
   CALCULATE TOTAL
===================================================== */

function calculateTotal() {

  let total = 0;


  items.forEach(
    function(item) {

      total +=
        parseFloat(item.amount)
        || 0;

    }
  );


  document.getElementById(
    "currentTotal"
  ).textContent =
    formatMoney(total);

}


/* =====================================================
   FORMAT MONEY
===================================================== */

function formatMoney(amount) {

  return "₱" +
    Number(amount || 0)
      .toLocaleString(
        "en-PH",
        {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }
      );

}


/* =====================================================
   RECEIPT PREVIEW
===================================================== */

document
  .getElementById("receipt")
  .addEventListener(
    "change",
    previewReceipt
  );


function previewReceipt() {

  const file =
    document.getElementById(
      "receipt"
    ).files[0];


  const preview =
    document.getElementById(
      "receiptPreview"
    );


  preview.innerHTML = "";


  if (!file) return;


  const img =
    document.createElement(
      "img"
    );


  img.src =
    URL.createObjectURL(file);


  preview.appendChild(img);

}


/* =====================================================
   SAVE INVENTORY
===================================================== */

async function saveInventory() {

  const validItems =
    items.filter(
      function(item) {

        return (
          item.description.trim() !== "" ||
          parseFloat(item.amount) > 0
        );

      }
    );


  if (validItems.length === 0) {

    alert(
      "Please add at least one inventory item."
    );

    return;

  }


  const receiptInput =
    document.getElementById(
      "receipt"
    );


  const receiptDate =
    document.getElementById(
      "receiptDate"
    ).value;


  let receiptName = "";


  if (
    receiptInput.files &&
    receiptInput.files.length > 0
  ) {

    receiptName =
      receiptInput.files[0].name;

  }


  const payload = {

    receipt:
      receiptName,

    receiptDate:
      receiptDate,

    items:
      validItems.map(
        function(item) {

          return {

            description:
              item.description.trim(),

            amount:
              parseFloat(
                item.amount
              ) || 0

          };

        }
      )

  };


  setStatus(
    "Saving to Google Sheets..."
  );


  try {

    await fetch(
      WEB_APP_URL,
      {

        method: "POST",

        mode: "no-cors",

        headers: {

          "Content-Type":
            "text/plain;charset=utf-8"

        },

        body:
          JSON.stringify(payload)

      }
    );


    await delay(1500);


    alert(
      "Inventory saved successfully!"
    );


    clearForm();

    loadInventory();


  } catch (error) {

    console.error(error);

    setStatus(
      "Could not save to Google Sheets."
    );

    alert(
      "Could not connect to Google Sheets."
    );

  }

}


/* =====================================================
   LOAD INVENTORY USING JSONP
===================================================== */

function loadInventory() {

  setStatus(
    "Loading from Google Sheets..."
  );


  const callbackName =
    "inventoryCallback_" +
    Date.now();


  window[callbackName] =
    function(data) {

      try {

        if (
          !data ||
          data.success !== true
        ) {

          throw new Error(
            data &&
            data.error
              ? data.error
              : "Google Sheets error"
          );

        }


        renderCloudTotal(
          data.grandTotal
        );


        renderHistory(
          data.entries
        );


        setStatus(
          "Connected to Google Sheets"
        );


      } catch (error) {

        console.error(error);

        setStatus(
          "Could not load Google Sheets."
        );

      }


      cleanup();

    };


  const script =
    document.createElement(
      "script"
    );


  script.src =
    WEB_APP_URL +
    "?callback=" +
    callbackName +
    "&t=" +
    Date.now();


  script.onerror =
    function() {

      setStatus(
        "Could not connect to Google Sheets."
      );

      cleanup();

    };


  document.body.appendChild(
    script
  );


  function cleanup() {

    delete window[
      callbackName
    ];

    if (script.parentNode) {

      script.parentNode.removeChild(
        script
      );

    }

  }

}


/* =====================================================
   CLOUD TOTAL
===================================================== */

function renderCloudTotal(total) {

  document.getElementById(
    "cloudTotal"
  ).textContent =
    formatMoney(total);

}


/* =====================================================
   HISTORY
===================================================== */

function renderHistory(entries) {

  const history =
    document.getElementById(
      "history"
    );


  history.innerHTML = "";


  if (
    !entries ||
    entries.length === 0
  ) {

    history.innerHTML = `

      <div class="empty">
        No inventory entries yet.
      </div>

    `;

    return;

  }


  entries.forEach(
    function(entry) {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "entry";


      let itemsHtml = "";


      entry.items.forEach(
        function(item) {

          itemsHtml += `

            <div class="entry-item">

              <span>
                ${escapeHtml(
                  item.description
                )}
              </span>

              <span>
                ${formatMoney(
                  item.amount
                )}
              </span>

            </div>

          `;

        }
      );


      div.innerHTML = `

        <div class="entry-date">

          Added:
          ${formatDate(
            entry.date
          )}

        </div>


        ${
          entry.receiptDate
            ? `
              <div class="entry-purchased">
                🛒 Purchased:
                ${formatReceiptDate(
                  entry.receiptDate
                )}
              </div>
            `
            : ""
        }


        ${
          entry.receipt
            ? `
              <div class="entry-receipt">
                Receipt:
                ${escapeHtml(
                  entry.receipt
                )}
              </div>
            `
            : ""
        }


        <div>

          ${itemsHtml}

        </div>


        <div class="entry-total">

          Total:
          ${formatMoney(
            entry.total
          )}

        </div>


        <button
          type="button"
          class="delete-btn"
          onclick="
            deleteCloudEntry(
              '${entry.entryId}'
            )
          "
        >
          🗑 Delete Entry
        </button>

      `;


      history.appendChild(div);

    }
  );

}


/* =====================================================
   DELETE CLOUD ENTRY
===================================================== */

async function deleteCloudEntry(
  entryId
) {

  if (
    !confirm(
      "Delete this inventory entry?"
    )
  ) {

    return;

  }


  setStatus(
    "Deleting..."
  );


  try {

    await fetch(
      WEB_APP_URL,
      {

        method: "POST",

        mode: "no-cors",

        headers: {

          "Content-Type":
            "text/plain;charset=utf-8"

        },

        body:
          JSON.stringify({

            action:
              "delete",

            entryId:
              entryId

          })

      }
    );


    await delay(1000);


    loadInventory();


  } catch (error) {

    console.error(error);

    alert(
      "Could not delete entry."
    );

  }

}


/* =====================================================
   CLEAR FORM
===================================================== */

function clearForm() {

  document.getElementById(
    "receipt"
  ).value = "";


  document.getElementById(
    "receiptDate"
  ).value = "";


  document.getElementById(
    "receiptPreview"
  ).innerHTML = "";


  items = [];


  addItem();

}


/* =====================================================
   STATUS
===================================================== */

function setStatus(message) {

  document.getElementById(
    "status"
  ).textContent =
    message;

}


/* =====================================================
   ADDED DATE
===================================================== */

function formatDate(date) {

  if (!date) return "";


  const d =
    new Date(date);


  if (
    isNaN(
      d.getTime()
    )
  ) {

    return String(date);

  }


  return d.toLocaleString(
    "en-PH",
    {

      year: "numeric",

      month: "short",

      day: "numeric",

      hour: "numeric",

      minute: "2-digit"

    }
  );

}


/* =====================================================
   RECEIPT / PURCHASE DATE
===================================================== */

function formatReceiptDate(date) {

  if (!date) return "";


  const parts =
    String(date).split("-");


  if (parts.length !== 3) {

    return String(date);

  }


  const year =
    Number(parts[0]);

  const month =
    Number(parts[1]) - 1;

  const day =
    Number(parts[2]);


  const d =
    new Date(
      year,
      month,
      day
    );


  if (
    isNaN(
      d.getTime()
    )
  ) {

    return String(date);

  }


  return d.toLocaleDateString(
    "en-PH",
    {

      year: "numeric",

      month: "short",

      day: "numeric"

    }
  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

  return String(value || "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   DELAY
===================================================== */

function delay(ms) {

  return new Promise(
    function(resolve) {

      setTimeout(
        resolve,
        ms
      );

    }
  );

}


/* =====================================================
   START
===================================================== */

addItem();

loadInventory();

</script>

</body>
</html>
