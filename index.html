<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renson Farm Inventory</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#07110b;color:#fff;min-height:100vh}
.header{
  position:sticky;top:0;z-index:10;text-align:center;padding:18px 10px;
  background:rgba(0,0,0,.9);border-bottom:1px solid #19d66b;
  color:#39ff88;font-size:22px;font-weight:900;letter-spacing:2px;
}
.container{width:100%;max-width:650px;margin:auto;padding:20px 12px 40px}
.card{
  background:#0d1b12;border:1px solid rgba(57,255,136,.35);
  border-radius:16px;padding:18px;margin-bottom:15px;
  box-shadow:0 0 20px rgba(57,255,136,.08)
}
.title{color:#39ff88;font-size:18px;font-weight:bold;margin-bottom:14px}
label{display:block;color:#b8cdbf;font-size:13px;margin:12px 0 6px}
input,textarea,button{
  width:100%;border:0;border-radius:10px;padding:12px;font-size:15px
}
input,textarea{background:#14251a;color:#fff;outline:none;border:1px solid #284b34}
input:focus,textarea:focus{border-color:#39ff88;box-shadow:0 0 8px rgba(57,255,136,.2)}
input[type=file]{padding:10px;background:#14251a}
.row{
  display:grid;grid-template-columns:1fr 120px 42px;gap:8px;
  margin-bottom:9px;align-items:center
}
.row input{width:100%}
.remove{
  background:#d93636;color:#fff;padding:10px 0;cursor:pointer;font-weight:bold
}
.add{
  margin-top:5px;background:#163b24;color:#39ff88;
  border:1px solid #39ff88;cursor:pointer;font-weight:bold
}
.total{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:16px;padding:16px;border-radius:12px;
  background:#071b0e;border:1px solid #39ff88
}
.total span:first-child{font-weight:bold}
#grandTotal{font-size:25px;color:#39ff88;font-weight:900}
.save{
  margin-top:15px;background:#39ff88;color:#031008;
  font-weight:900;cursor:pointer
}
.clear{margin-top:8px;background:#333;color:#fff;cursor:pointer}
.preview{display:none;margin-top:12px;text-align:center}
.preview img{max-width:100%;max-height:300px;border-radius:10px;border:1px solid #39ff88}
.history-item{
  padding:12px;border-bottom:1px solid #203a28;font-size:14px
}
.actions{display:flex;gap:7px;margin-top:9px}
.actions button{padding:8px;font-size:12px;cursor:pointer}
.edit-btn{background:#294d35;color:#39ff88;border:1px solid #39ff88}
.delete-btn{background:#4a2020;color:#ff8b8b;border:1px solid #ff6666}
.history-item:last-child{border-bottom:0}
.muted{color:#91a699;font-size:12px}
@media(max-width:520px){
  .row{grid-template-columns:1fr 100px 38px}
  .header{font-size:18px}
}
</style>
</head>
<body>

<div class="header">🌴 RENSON FARM INVENTORY</div>

<div class="container">

  <div class="card">
    <div class="title">📷 Capture Receipt</div>
    <label for="receipt">Receipt photo</label>
    <input id="receipt" type="file" accept="image/*" capture="environment"
           onchange="previewReceipt(event)">
    <div id="preview" class="preview">
      <img id="receiptPreview" alt="Receipt preview">
    </div>
  </div>

  <div class="card">
    <div class="title">🧾 Inventory Details</div>

    <div id="items"></div>

    <button type="button" class="add" onclick="addItem()">＋ ADD ITEM</button>

    <div class="total">
      <span>GRAND TOTAL</span>
      <span id="grandTotal">₱0.00</span>
    </div>

    <button type="button" class="save" onclick="saveInventory()">💾 SAVE INVENTORY</button>
    <button type="button" class="clear" onclick="clearForm()">CLEAR</button>
  </div>

  <div class="card">
    <div class="title">📋 Recent Entries</div>
    <div id="history"><div class="muted">No saved entries yet.</div></div>
  </div>

</div>

<script>
let items = [];

function addItem(description="", amount=""){
  const id = Date.now() + Math.random();
  items.push({id, description, amount});
  renderItems();
}

function removeItem(id){
  items = items.filter(item => item.id !== id);
  renderItems();
}

function updateItem(id, field, value){
  const item = items.find(x => x.id === id);
  if(!item) return;
  item[field] = field === "amount"
    ? value.replace(/[^0-9.]/g, "")
    : value;
  calculateTotal();
}

function renderItems(){
  const box = document.getElementById("items");
  box.innerHTML = "";

  if(items.length === 0){
    addItem();
    return;
  }

  items.forEach((item, index) => {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `
      <input type="text"
        placeholder="Description"
        value="${escapeHtml(item.description)}"
        oninput="updateItem(${item.id}, 'description', this.value)">
      <input type="number"
        step="0.01" min="0"
        placeholder="Amount"
        value="${item.amount}"
        oninput="updateItem(${item.id}, 'amount', this.value)">
      <button type="button" class="remove"
        onclick="removeItem(${item.id})">×</button>
    `;
    box.appendChild(row);
  });

  calculateTotal();
}

function calculateTotal(){
  const total = items.reduce((sum, item) => {
    const amount = parseFloat(item.amount);
    return sum + (isNaN(amount) ? 0 : amount);
  }, 0);

  document.getElementById("grandTotal").textContent =
    "₱" + total.toLocaleString("en-PH", {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    });
}

function previewReceipt(event){
  const file = event.target.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById("receiptPreview").src = e.target.result;
    document.getElementById("preview").style.display = "block";
  };
  reader.readAsDataURL(file);
}

async function saveInventory(){
  const validItems = items.filter(x =>
    x.description.trim() !== "" || parseFloat(x.amount) > 0
  );

  if(validItems.length === 0){
    alert("Maglagay muna ng inventory item at amount.");
    return;
  }

  const total = validItems.reduce((sum, x) =>
    sum + (parseFloat(x.amount) || 0), 0);

  const receiptFile = document.getElementById("receipt").files[0];
  const receiptName = receiptFile ? receiptFile.name : "";

  const WEB_APP_URL =
    "https://script.google.com/macros/s/AKfycbwoULx5Wp4M_L5lR0l9aZ6Upwm7VUUu2eg3FT-sMz_WV6ka1LF3KYZtaOS704YNv_cG_Q/exec";

  const saveButton = document.querySelector(".save");
  saveButton.disabled = true;
  saveButton.textContent = "⏳ SAVING...";

  try {
    // Save each inventory detail as its own row.
    for(const item of validItems){
      const payload = {
        receipt: receiptName,
        description: item.description,
        amount: parseFloat(item.amount) || 0,
        total: total
      };

      await fetch(WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(payload)
      });
    }

    alert(
      "Inventory saved to Google Sheets!\n\n" +
      "Total: ₱" + total.toLocaleString("en-PH", {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      })
    );

    // Keep local history as a backup.
    const history = JSON.parse(
      localStorage.getItem("rensonInventory") || "[]"
    );

    const updatedEntry = {
      date: new Date().toLocaleString("en-PH"),
      items: validItems,
      total: total
    };

    if(window.editingIndex !== undefined && window.editingIndex !== null){
      history[window.editingIndex] = updatedEntry;
      window.editingIndex = null;
    } else {
      history.unshift(updatedEntry);
    }

    localStorage.setItem("rensonInventory", JSON.stringify(history));
    renderHistory();
    document.querySelector(".save").textContent = "💾 SAVE INVENTORY";

  } catch(error) {
    console.error(error);
    alert("Hindi na-save. Pakicheck ang internet connection at Apps Script deployment.");
  } finally {
    saveButton.disabled = false;
    saveButton.textContent = "💾 SAVE INVENTORY";
  }
}

function renderHistory(){
  const history = JSON.parse(localStorage.getItem("rensonInventory") || "[]");
  const box = document.getElementById("history");

  if(history.length === 0){
    box.innerHTML = '<div class="muted">No saved entries yet.</div>';
    return;
  }

  box.innerHTML = history.slice(0,10).map((entry, index) => `
    <div class="history-item">
      <div><strong>${entry.date}</strong></div>
      <div class="muted">${entry.items.map(x =>
        `${escapeHtml(x.description || "Item")} — ₱${(parseFloat(x.amount)||0).toFixed(2)}`
      ).join("<br>")}</div>
      <div style="margin-top:6px;color:#39ff88;font-weight:bold">
        Total: ₱${entry.total.toFixed(2)}
      </div>
      <div class="actions">
        <button class="edit-btn" onclick="editEntry(${index})">✏️ EDIT</button>
        <button class="delete-btn" onclick="deleteEntry(${index})">🗑️ DELETE</button>
      </div>
    </div>
  `).join("");
}

function editEntry(index){
  const history = JSON.parse(localStorage.getItem("rensonInventory") || "[]");
  const entry = history[index];
  if(!entry) return;

  items = entry.items.map(x => ({
    id: Date.now() + Math.random(),
    description: x.description || "",
    amount: x.amount || ""
  }));

  renderItems();
  window.scrollTo({top:0, behavior:"smooth"});

  // Keep the original entry for replacement after saving.
  window.editingIndex = index;
  document.querySelector(".save").textContent = "💾 UPDATE INVENTORY";
}

function deleteEntry(index){
  const history = JSON.parse(localStorage.getItem("rensonInventory") || "[]");
  const entry = history[index];
  if(!entry) return;

  if(!confirm("Delete this inventory entry?")) return;

  history.splice(index, 1);
  localStorage.setItem("rensonInventory", JSON.stringify(history));
  renderHistory();
} 

function clearForm(){
  if(confirm("Clear current inventory details?")){
    items = [];
    document.getElementById("receipt").value = "";
    document.getElementById("preview").style.display = "none";
    renderItems();
  }
}

function escapeHtml(text){
  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

renderItems();
renderHistory();
</script>

</body>
</html>
