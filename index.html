<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Klickzone Hotspot</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#000;
  color:#fff;
}

/* 🔥 BRAND HEADER (LOGO STYLE) */
.brand-header{
  text-align:center;
  padding:18px 10px;
  font-size:22px;
  font-weight:900;
  letter-spacing:3px;
  color:#00ffcc;
  text-transform:uppercase;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:20;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(0,255,204,0.3);
  text-shadow:
    0 0 5px #00ffcc,
    0 0 10px #00ffcc,
    0 0 20px #00ffcc;
  animation:glowMove 3s infinite alternate;
}

@keyframes glowMove{
  0%{
    text-shadow:0 0 5px #00ffcc,0 0 10px #00ffcc;
    letter-spacing:3px;
  }
  100%{
    text-shadow:0 0 15px #00ffcc,0 0 30px #00ffcc;
    letter-spacing:5px;
  }
}

/* TOP MENU */
.nav{
  position:fixed;
  top:60px;
  left:0;
  width:100%;
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(10px);
  display:flex;
  justify-content:space-around;
  padding:12px 5px;
  z-index:10;
  border-bottom:1px solid rgba(0,255,204,0.3);
}

.nav a{
  color:#00ffcc;
  text-decoration:none;
  font-size:12px;
  font-weight:bold;
}

/* MAIN */
.container{
  padding-top:140px;
  max-width:500px;
  margin:auto;
  text-align:center;
}

/* VIDEO */
.video-box video{
  width:100%;
  height:260px;
  object-fit:cover;
  border-radius:12px;
  border:2px solid #00ffcc;
}

/* TIMER */
.timer{
  margin-top:10px;
  font-size:16px;
  color:#00ffcc;
  font-weight:bold;
}

/* CONNECT BUTTON */
button.connect{
  width:100%;
  padding:15px;
  margin-top:15px;
  border:none;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
  background:#00ffcc;
  color:#000;
  cursor:not-allowed;
  opacity:0.5;
}

button.connect.enabled{
  cursor:pointer;
  opacity:1;
}

/* VOUCHER SECTION */
.voucher-section{
  margin-top:30px;
  padding:10px;
}

.voucher-title{
  color:#00ffcc;
  font-size:18px;
  margin-bottom:10px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:10px;
}

.card{
  background:rgba(0,255,204,0.08);
  border:1px solid #00ffcc;
  border-radius:12px;
  padding:15px;
}

.price{
  font-size:28px;
  color:#00ffcc;
  font-weight:bold;
}

.desc{
  font-size:13px;
  margin:8px 0;
  opacity:0.8;
}

.buy{
  width:100%;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#00ffcc;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}

.buy:hover{
  opacity:0.8;
}

</style>
</head>

<body>

<!-- 🔥 BRAND HEADER -->
<div class="brand-header">
  KLICKZONE HOTSPOT & DIGITAL PRINT
</div>

<!-- TOP MENU -->
<div class="nav">
  <a href="#">Printing</a>
  <a href="#">Xerox</a>
  <a href="#">Scanning</a>
  <a href="#">Repair</a>
  <a href="#">WiFi</a>
</div>

<div class="container">

  <!-- ADS VIDEO -->
  <div class="video-box">
    <video id="adsVideo" autoplay muted playsinline>
      <source src="ads.mp4" type="video/mp4">
    </video>
  </div>

  <!-- TIMER -->
  <div class="timer">
    Please wait: <span id="count">30</span>s
  </div>

  <!-- CONNECT -->
  <button id="connectBtn" class="connect" disabled onclick="location.href='http://120.10.10.1/login2.html'">
    CONNECT NOW
  </button>

  <!-- VOUCHER MENU -->
  <div class="voucher-section">

    <div class="voucher-title">💳 WIFI VOUCHER PRICES</div>

    <div class="grid">

      <div class="card">
        <div class="price">₱10</div>
        <div class="desc">8 HOURS ACCESS</div>
        <button class="buy" onclick="location.href='payment.html'">BUY NOW</button>
      </div>

      <div class="card">
        <div class="price">₱20</div>
        <div class="desc">1 DAY ACCESS</div>
        <button class="buy" onclick="location.href='payment.html'">BUY NOW</button>
      </div>

      <div class="card">
        <div class="price">₱50</div>
        <div class="desc">3 DAYS ACCESS</div>
        <button class="buy" onclick="location.href='payment.html'">BUY NOW</button>
      </div>

      <div class="card">
        <div class="price">₱100</div>
        <div class="desc">1 MONTH ACCESS</div>
        <button class="buy" onclick="location.href='payment.html'">BUY NOW</button>
      </div>

    </div>

  </div>

</div>

<script>

let timeLeft = 30;

const count = document.getElementById("count");
const btn = document.getElementById("connectBtn");
const video = document.getElementById("adsVideo");

function unlock(){
  btn.disabled = false;
  btn.classList.add("enabled");
}

/* TIMER */
const interval = setInterval(()=>{
  timeLeft--;
  count.innerText = timeLeft;

  if(timeLeft <= 0){
    clearInterval(interval);
    unlock();
  }
},1000);

/* VIDEO END */
video.addEventListener("ended", ()=>{
  clearInterval(interval);
  unlock();
});

</script>

</body>
</html>
