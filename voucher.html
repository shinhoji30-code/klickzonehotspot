<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voucher System</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#000;
  color:#fff;
  text-align:center;
  padding:25px;
}

.box{
  max-width:420px;
  margin:auto;
  background:rgba(0,255,204,0.08);
  border:1px solid #00ffcc;
  border-radius:15px;
  padding:20px;
  box-shadow:0 0 20px rgba(0,255,204,0.2);
}

h2{
  color:#00ffcc;
}

input, select{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:none;
  outline:none;
  background:#111;
  color:#fff;
  border:1px solid #00ffcc;
}

button{
  width:100%;
  padding:12px;
  margin-top:12px;
  border:none;
  border-radius:10px;
  background:#00ffcc;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}

.voucher{
  font-size:28px;
  font-weight:bold;
  color:#00ffcc;
  margin-top:20px;
  letter-spacing:3px;
  border:1px dashed #00ffcc;
  padding:10px;
  border-radius:10px;
  display:none;
}

.small{
  font-size:12px;
  opacity:0.7;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="box">

<h2>💳 PAYMENT VERIFICATION</h2>

<form id="payForm">

<input type="text" placeholder="Full Name" required>

<input type="text" placeholder="GCash Reference #" required>

<select required>
  <option value="">Select Plan</option>
  <option value="10">₱10 - 8 Hours</option>
  <option value="20">₱20 - 1 Day</option>
  <option value="50">₱50 - 3 Days</option>
  <option value="100">₱100 - 1 Month</option>
</select>

<button type="submit">SUBMIT FOR VERIFICATION</button>

</form>

<!-- VOUCHER RESULT -->
<div class="voucher" id="voucherBox"></div>

<button id="connectBtn" style="display:none;" onclick="location.href='http://120.10.10.1/login2.html'">
⚡ CONNECT WIFI
</button>

<div class="small">
We will verify your GCash payment before activating voucher.
</div>

</div>

<script>

/* FORM SUBMIT */
document.getElementById("payForm").addEventListener("submit", function(e){
  e.preventDefault();

  generateVoucher();
});

/* GENERATE VOUCHER */
function generateVoucher(){
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
  let code = "KLICK-";

  for(let i=0;i<6;i++){
    code += chars[Math.floor(Math.random()*chars.length)];
  }

  document.getElementById("voucherBox").innerText = code;
  document.getElementById("voucherBox").style.display = "block";

  document.getElementById("connectBtn").style.display = "block";

  alert("Payment submitted! Wait for verification.");
}

</script>

</body>
</html>
